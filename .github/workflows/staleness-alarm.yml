# .github/workflows/staleness-alarm.yml
name: staleness-alarm

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python -m fpl.check_staleness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
